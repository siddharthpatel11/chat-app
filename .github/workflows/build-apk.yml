name: Build Android APK

on:
  push:
    branches: [ main, master ]
    paths:
      - 'android-app/**'
  workflow_dispatch:   # allow manual trigger from GitHub UI

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Set up JDK ──────────────────────────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ── 3. Grant Gradle execute permission ─────────────────────────────────
      - name: Make gradlew executable
        run: chmod +x android-app/gradlew

      # ── 4. Cache Gradle dependencies ───────────────────────────────────────
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android-app/**/*.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # ── 5. Build debug APK ─────────────────────────────────────────────────
      - name: Build debug APK
        working-directory: android-app
        run: ./gradlew assembleDebug --no-daemon

      # ── 6. Copy APK to public/download ─────────────────────────────────────
      - name: Copy APK to public directory
        run: |
          mkdir -p public/download
          cp android-app/app/build/outputs/apk/debug/app-debug.apk public/download/chat-app.apk
          echo "APK copied to public/download/chat-app.apk"
          ls -lh public/download/

      # ── 7. Commit APK back to repo ─────────────────────────────────────────
      - name: Commit and push APK
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "ci: auto-build Android APK [skip ci]"
          file_pattern: public/download/chat-app.apk
          commit_user_name: "GitHub Actions Bot"
          commit_user_email: "actions@github.com"

      # ── 8. Also upload as workflow artifact ────────────────────────────────
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: chat-app-debug
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
